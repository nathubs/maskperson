[project]
name = "maskperson"
version = "0.1.0"
description = "视频人体脱敏工具 — YOLO 跟踪 + 马赛克"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Eden" }]

dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "ultralytics>=8.3.0",
    "toml>=0.10.0",
    "lap>=0.5.12",
    # 显式声明以让 [tool.uv.sources] 生效，覆盖 ultralytics 隐式拉入的 torch
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-toml>=0.10.0",
]
# 强制使用 CPU 版 torch wheel（默认从 PyPI 拉 CUDA 版 wheel，无 GPU 时运行时自动降级）
cpu = [
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-linux_x86_64.whl",
    "torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.20.1%2Bcpu-cp312-cp312-linux_x86_64.whl",
]

[project.scripts]
maskperson = "maskperson.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# 允许 optional-dependencies 使用 URL 直引（CPU 版 torch wheel）
allow-direct-references = true

# torch 默认从 PyPI 拉取（CUDA 版 wheel），无 NVIDIA GPU 时运行时自动降级 CPU。
# 若需强制 CPU wheel（减小体积、避开 CUDA 驱动版本要求）：
#   uv sync --no-extra default --extra cpu

# 显式覆盖 torch 来源到 PyPI，避免 uv 默认从 PyTorch CPU 索引拉
[tool.uv.sources]
torch = { index = "pypi" }
torchvision = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.mirrors.ustc.edu.cn/simple"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
